name: Bundle Modxo

on:
  push:
    branches: [ "main", "custom" ]
  pull_request:
    branches: [ "main", "custom" ]
  workflow_dispatch: {}
  
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.merge.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch custom branch (if present)
        run: |
          if git ls-remote --exit-code --heads origin custom >/dev/null 2>&1; then
            git fetch --no-tags origin custom:refs/remotes/origin/custom
          else
            echo "origin/custom not found; using base matrix only"
          fi

      - name: Merge matrix includes from custom branch
        id: merge
        run: python3 .github/scripts/prepare_bundle_matrix.py

  build:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Fetch custom branch (if present)
        run: |
          if git ls-remote --exit-code --heads origin custom >/dev/null 2>&1; then
            git fetch --no-tags origin custom:refs/remotes/origin/custom
          else
            echo "origin/custom not found; using pinouts from this ref only"
          fi

      - name: Ensure board pinout file exists
        run: |
          PINOUT="${{ matrix.pinout }}"
          FILE="boards/${PINOUT}.cmake"
          if [ -f "$FILE" ]; then
            exit 0
          fi
          if git rev-parse --verify origin/custom >/dev/null 2>&1; then
            if git show "origin/custom:${FILE}" > "$FILE" 2>/dev/null; then
              echo "Using ${FILE} from origin/custom"
              exit 0
            fi
          fi
          echo "::error::Missing pinout file ${FILE}"
          exit 1

      - name: Install Dependencies
        run: sudo apt install cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Create Build Folder
        run: |
          mkdir build
          mkdir output

      - name: Build Modxo ${{ matrix.pretty_name }}
        uses: threeal/cmake-action@v2
        id: cmake
        with:
          options: |
            PICO_SDK_PATH=${{ github.workspace }}/external/pico-sdk
            MODXO_PINOUT=${{ matrix.pinout }}
            PICO_BOARD=${{ matrix.pico_board }}

      - name: Copy files
        run: |
          cp ${{ steps.cmake.outputs.build-dir }}/${{ matrix.output_name }}.bin ${{ github.workspace }}/output/
          cp ${{ steps.cmake.outputs.build-dir }}/${{ matrix.output_name }}.uf2 ${{ github.workspace }}/output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.pretty_name }}
          path: ${{ github.workspace }}/output/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: bundle-modxo-release
      cancel-in-progress: false
    if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/custom') || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        id: artifacts
        with:
          path: pipeline/build/artifacts
          merge-multiple: true

      - name: List Files
        run: |
          ls -la ${{ steps.artifacts.outputs.download-path }}

      - name: Archive release artifacts
        run: |
          cd "${{ steps.artifacts.outputs.download-path }}"
          zip -r "${{ github.workspace }}/modxo-bundle.zip" .

      - name: Update latest draft release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/custom'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          draft: true
          files: ${{ github.workspace }}/modxo-bundle.zip

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/modxo-bundle.zip